image:
  backend:
    repository: ghcr.io/akash642-eng/cinebook-backend
    tag: "c70ebd7e524bfdfb6eb1263fb516e89fc43cd18f"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/akash642-eng/cinebook-frontend
    tag: "c70ebd7e524bfdfb6eb1263fb516e89fc43cd18f"
    pullPolicy: IfNotPresent

# Values live outside this chart; only Secret key references are rendered.
secretName: cinebook-secrets

backend:
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi

frontend:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  replicas: 1
  image: postgres:16-alpine
  database: cinebook
  user: cinebook
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    existingClaim: cinebook-postgres-pvc
    size: 2Gi
    storageClassName: standard

rabbitmq:
  replicas: 1
  image: rabbitmq:4-management
  user: cinebook
  port: 5672
  managementPort: 15672
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    existingClaim: cinebook-rabbitmq-pvc
    size: 1Gi
    storageClassName: standard

# Existing claims are reused by default. Enable only for a new namespace.
persistence:
  createClaims: false

ingress:
  enabled: true
  className: nginx
  host: cinebook.local
