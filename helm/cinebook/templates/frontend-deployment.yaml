apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinebook-frontend
  labels:
    app: cinebook-frontend
    app.kubernetes.io/name: cinebook-frontend
    app.kubernetes.io/part-of: cinebook
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cinebook-frontend
  template:
    metadata:
      labels:
        app: cinebook-frontend
        app.kubernetes.io/name: cinebook-frontend
        app.kubernetes.io/part-of: cinebook
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
