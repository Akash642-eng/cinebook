apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cinebook-postgres-pvc
  namespace: cinebook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cinebook-rabbitmq-pvc
  namespace: cinebook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
